; Build and upload: open this folder's parent in VS Code with the PlatformIO extension,
; or run `pio run -d firmware -t upload` from the repository root.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
build_flags = -Wall -Wextra
