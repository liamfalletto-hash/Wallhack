<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallhack Console</title>
<style>
  :root {
    --bg: #0f1114; --surface: #15181c; --surface-2: #1b1f24; --line: #262b32; --line-strong: #353b44;
    --text: #d9dde3; --text-2: #8b939e; --text-3: #5d6570;
    --wall: #c3c9d1; --furniture: #2a3038; --grid: #1a1e23;
    --fov: 96, 139, 176; --track: #e8ebef; --hit: 155, 163, 173;
    --ok: #4caf7a; --warn: #d9a441; --bad: #d9534f; --still: #7fb0d9; --turn: #d9a441;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100%; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface);
    border-bottom: 1px solid var(--line); white-space: nowrap; overflow-x: auto; }
  header .name { font-weight: 600; letter-spacing: 0.01em; }
  header .sep { width: 1px; height: 18px; background: var(--line-strong); }
  .kv { color: var(--text-2); }
  .kv b { color: var(--text); font: 500 12px var(--mono); font-variant-numeric: tabular-nums; margin-left: 6px; }
  .chips { display: flex; gap: 8px; margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--line-strong);
    border-radius: 3px; color: var(--text-2); font-size: 12px; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .chip.ok::before { background: var(--ok); } .chip.warn::before { background: var(--warn); }
  .chip.bad::before { background: var(--bad); }
  .mode-badge.live { color: #0f1114; background: var(--ok); border-color: var(--ok); }
  .mode-badge { padding: 1px 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line-strong);
    font: 600 11px var(--mono); color: var(--text-2); }
  main { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
  .map { position: relative; min-width: 0; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; }
  aside h2 { margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600; color: var(--text-2);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  th { text-align: left; font: 500 11px var(--sans); color: var(--text-3); padding: 6px 10px 4px; white-space: nowrap; }
  td { padding: 5px 10px; border-top: 1px solid var(--line); color: var(--text); white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 14px; }
  td.dim { color: var(--text-2); }
  .state { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); }
  .state i { width: 8px; height: 8px; border-radius: 50%; }
  .empty { padding: 14px; color: var(--text-3); }
  .legend { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--text-2); display: grid; gap: 6px; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .legend svg { flex: none; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 16px; background: var(--surface);
    border-top: 1px solid var(--line); }
  button, select { font: 500 12px var(--sans); color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line-strong); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--text-3); }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--text-2); }
  label { display: flex; align-items: center; gap: 6px; color: var(--text-2); cursor: pointer; }
  footer .kv b { font-size: 12px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 34vh; }
    .legend { display: none; }
    header { gap: 6px 10px; flex-wrap: wrap; }
    header .sep { display: none; }
    .chips { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <span class="name">Wallhack</span>
  <span class="mode-badge" id="mode">REPLAY</span>
  <span class="sep"></span>
  <span class="kv">Source<b id="src">—</b></span>
  <span class="kv">Time<b id="time">00:00:00.0</b></span>
  <span class="kv">Heading<b id="heading">—</b></span>
  <span class="kv" id="rec-wrap" hidden>Recording<b id="rec"></b></span>
  <div class="chips">
    <span class="chip" id="chip-radar">LD2450</span>
    <span class="chip" id="chip-presence">LD2410</span>
    <span class="chip" id="chip-imu">IMU</span>
  </div>
</header>
<main>
  <div class="map"><canvas id="map"></canvas></div>
  <aside>
    <h2><span>Tracks</span><span id="ntracks">0</span></h2>
    <table>
      <thead><tr><th>ID</th><th>State</th><th>Range</th><th>Speed</th><th>Last seen</th></tr></thead>
      <tbody id="tracks"></tbody>
    </table>
    <div class="empty" id="no-tracks">No confirmed tracks</div>
    <div class="legend">
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="#e8ebef"/></svg>Track (moving)</span>
      <span><svg width="14" height="14"><rect x="3" y="3" width="8" height="8" fill="#7fb0d9"/></svg>Track (still)</span>
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="none" stroke="#e8ebef" stroke-dasharray="2 2"/></svg>Not currently detected</span>
      <span><svg width="14" height="14"><rect x="4" y="4" width="6" height="6" fill="none" stroke="#9ba3ad"/></svg>Radar detection</span>
      <span><svg width="14" height="14"><path d="M1 12 A 11 11 0 0 1 12 1" fill="none" stroke="#d9a441"/></svg>LD2410 still-person range</span>
      <span id="legend-truth"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="#5d6570" stroke-dasharray="1 2"/></svg>Ground truth (simulation)</span>
    </div>
  </aside>
</main>
<footer>
  <button id="play">Pause</button>
  <select id="speed" aria-label="Playback speed">
    <option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
  </select>
  <input id="seek" type="range" min="0" value="0" aria-label="Timeline">
  <span class="kv">Frame<b id="frameno">0</b></span>
  <label><input id="truth" type="checkbox" checked> Ground truth</label>
</footer>
<script>
const FADE_S = 1.0;            // radar detections fade out over this long
const HISTORY_S = 4.0;         // track history trail length
const LEADER_S = 1.0;          // velocity leader shows where the track is in this many seconds
const RANGE_M = 6, HALF_FOV = Math.PI / 3, RINGS_M = [2, 4, 6];
const MARGIN_M = 0.8, GATE_M = 0.75;
const STATE = { walking: ["Moving", "--track"], manoeuvring: ["Turning", "--turn"], still: ["Still", "--still"] };

const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const ui = Object.fromEntries(["play", "speed", "seek", "time", "heading", "src", "mode", "frameno", "truth",
  "ntracks", "tracks", "no-tracks", "chip-radar", "chip-presence", "chip-imu", "legend-truth", "rec-wrap", "rec"].map(id => [id, $(id)]));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const C = {};
["--wall", "--furniture", "--grid", "--fov", "--track", "--hit", "--still", "--turn", "--warn", "--text-2", "--text-3",
  "--surface"].forEach(k => { C[k] = css(k); });
const FONT = `11px ${css("--mono")}`, FONT_SANS = `500 11px ${css("--sans")}`;

const STALE_MS = 1500;          // live: warn when no frame has arrived for this long
let plan, session, frame = null, hits = [], history = new Map(), es = null, playing = true;
let lastFrameMs = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function view() {
  const b = plan.bounds, w = canvas.clientWidth, h = canvas.clientHeight;
  const bw = b.xmax - b.xmin + 2 * MARGIN_M, bh = b.ymax - b.ymin + 2 * MARGIN_M;
  const s = Math.min(w / bw, h / bh);
  const ox = (w - bw * s) / 2 - (b.xmin - MARGIN_M) * s, oy = (h + bh * s) / 2 + (b.ymin - MARGIN_M) * s;
  return { s, px: (x, y) => [ox + x * s, oy - y * s] };
}

function poly(v, pts) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => { const [a, b] = v.px(x, y); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
  ctx.closePath();
}

function seg(v, a, b) { ctx.beginPath(); ctx.moveTo(...v.px(...a)); ctx.lineTo(...v.px(...b)); ctx.stroke(); }

function draw() {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  if (!plan) return;
  const v = view();
  drawGrid(v);
  ctx.fillStyle = C["--furniture"];
  (plan.obstacles || []).forEach(o => { poly(v, o.polygon); ctx.fill(); });
  if (frame) drawSensor(v);
  ctx.strokeStyle = C["--wall"]; ctx.lineCap = "square";
  plan.walls.forEach(w => { ctx.lineWidth = ["brick", "concrete"].includes(w.material) ? 3 : 1.5; seg(v, w.a, w.b); });
  drawScale(v);
  if (!frame) {
    if (session && session.live) {
      ctx.fillStyle = C["--text-2"]; ctx.font = `500 14px ${css("--sans")}`; ctx.textAlign = "center";
      ctx.fillText(`Waiting for helmet data on ${session.header.src}…`, canvas.clientWidth / 2, canvas.clientHeight / 2);
    }
    return;
  }
  if (ui.truth.checked && frame.truth) drawTruth(v);
  drawHits(v);
  drawTracks(v);
  drawOperator(v);
}

function drawGrid(v) {
  const b = plan.bounds;
  ctx.strokeStyle = C["--grid"]; ctx.lineWidth = 1;
  for (let x = Math.ceil(b.xmin - MARGIN_M); x <= b.xmax + MARGIN_M; x++) seg(v, [x, b.ymin - MARGIN_M], [x, b.ymax + MARGIN_M]);
  for (let y = Math.ceil(b.ymin - MARGIN_M); y <= b.ymax + MARGIN_M; y++) seg(v, [b.xmin - MARGIN_M, y], [b.xmax + MARGIN_M, y]);
}

function drawScale(v) {
  const x0 = 16, y0 = canvas.clientHeight - 18, len = v.s;
  ctx.strokeStyle = C["--text-2"]; ctx.fillStyle = C["--text-2"]; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 4); ctx.lineTo(x0, y0); ctx.lineTo(x0 + len, y0); ctx.lineTo(x0 + len, y0 - 4); ctx.stroke();
  ctx.font = FONT; ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillText("1 m", x0 + len + 6, y0 + 4);
}

function arc(hx, hy, r) {
  const yaw = frame.yaw ?? 0;
  ctx.arc(hx, hy, r, -yaw - HALF_FOV, -yaw + HALF_FOV);
}

function drawSensor(v) {
  const pose = frame.pose || { x: 0, y: 0 }, yaw = frame.yaw ?? 0, [hx, hy] = v.px(pose.x, pose.y);
  ctx.fillStyle = `rgba(${C["--fov"]}, 0.06)`; ctx.strokeStyle = `rgba(${C["--fov"]}, 0.45)`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hx, hy); arc(hx, hy, RANGE_M * v.s); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = `rgba(${C["--fov"]}, 0.25)`; ctx.setLineDash([3, 4]);
  RINGS_M.slice(0, -1).forEach(r => { ctx.beginPath(); arc(hx, hy, r * v.s); ctx.stroke(); });
  ctx.setLineDash([]);
  ctx.fillStyle = `rgba(${C["--fov"]}, 0.8)`; ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  RINGS_M.forEach(r => {
    const a = yaw + HALF_FOV + 0.06;
    ctx.fillText(`${r} m`, hx + r * v.s * Math.cos(a), hy - r * v.s * Math.sin(a));
  });
  const pr = frame.presence;
  if (pr) [["still_m", C["--warn"]], ["moving_m", C["--text-2"]]].forEach(([key, color]) => {
    if (pr[key] == null) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash(key === "moving_m" ? [4, 3] : []);
    ctx.beginPath(); arc(hx, hy, pr[key] * v.s); ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawOperator(v) {
  const pose = frame.pose || { x: 0, y: 0 }, yaw = frame.yaw ?? 0, [hx, hy] = v.px(pose.x, pose.y);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(-yaw);
  ctx.fillStyle = `rgb(${C["--fov"]})`; ctx.strokeStyle = C["--surface"]; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6); ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = C["--text-2"]; ctx.font = FONT_SANS; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillText("Sensor", hx, hy + 10);
}

function drawTruth(v) {
  ctx.strokeStyle = C["--text-3"]; ctx.fillStyle = C["--text-3"]; ctx.lineWidth = 1; ctx.setLineDash([1, 3]);
  ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  frame.truth.people.forEach(p => {
    const [x, y] = v.px(p.x, p.y), r = 0.25 * v.s;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillText(`GT${p.id}`, x, y - r - 2);
  });
  ctx.setLineDash([]);
}

function drawHits(v) {
  hits.forEach(d => {
    const age = frame.t_dev - d.t, [x, y] = v.px(d.x, d.y), a = Math.max(0, 1 - age / FADE_S);
    ctx.strokeStyle = `rgba(${C["--hit"]}, ${0.9 * a})`; ctx.lineWidth = 1;
    ctx.strokeRect(x - 3, y - 3, 6, 6);
  });
}

function stateOf(t) { return STATE[t.mode] || ["Tracked", "--track"]; }

function drawTracks(v) {
  (frame.tracks || []).forEach(t => {
    const color = C[stateOf(t)[1]], [x, y] = v.px(t.x, t.y);
    ctx.fillStyle = color; ctx.strokeStyle = color;
    (history.get(t.id) || []).forEach(([hx, hy], k, arr) => {
      const [px, py] = v.px(hx, hy);
      ctx.globalAlpha = 0.15 + 0.45 * (k / arr.length); ctx.fillRect(px - 1, py - 1, 2, 2);
    });
    ctx.globalAlpha = 1;
    const lead = t.path[1] || [t.x, t.y], [lx, ly] = v.px(...lead);
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lx, ly); ctx.stroke();

    ctx.lineWidth = 1.5; ctx.setLineDash(t.coasting ? [2, 2] : []);
    ctx.beginPath();
    if (t.mode === "still") ctx.rect(x - 5, y - 5, 10, 10); else ctx.arc(x, y, 5, 0, 2 * Math.PI);
    t.coasting ? ctx.stroke() : ctx.fill();
    ctx.setLineDash([]);

    const left = lx - x > 2 && x - 60 > 0;
    ctx.font = FONT; ctx.textAlign = left ? "right" : "left"; ctx.textBaseline = "middle"; ctx.fillStyle = C["--track"];
    ctx.fillText(`T${t.id}`, left ? x - 10 : x + 10, y - 7);
  });
}

function updateHistory(f) {
  const live = new Set(f.tracks.map(t => t.id));
  for (const id of history.keys()) if (!live.has(id)) history.delete(id);
  f.tracks.forEach(t => {
    const h = history.get(t.id) || [];
    h.push([t.x, t.y, f.t_dev]);
    while (h.length && f.t_dev - h[0][2] > HISTORY_S) h.shift();
    history.set(t.id, h);
  });
}

function fmtTime(t) {
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = (t % 60).toFixed(1).padStart(4, "0");
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${s}`;
}

function setChip(el, cls, title) { el.className = `chip ${cls}`; el.title = title; }

function updatePanel(f) {
  const pose = f.pose || { x: 0, y: 0 };
  const rows = f.tracks.map(t => {
    const [label, colorVar] = stateOf(t), lead = t.path[1] || [t.x, t.y];
    const speed = Math.hypot(lead[0] - t.x, lead[1] - t.y), range = Math.hypot(t.x - pose.x, t.y - pose.y);
    const seen = t.coasting ? "lost" : "now";
    return `<tr><td>T${t.id}</td><td><span class="state"><i style="background:var(${colorVar})"></i>${label}</span></td>` +
      `<td>${range.toFixed(1)} m</td><td>${speed.toFixed(1)} m/s</td><td class="dim">${seen}</td></tr>`;
  });
  ui.tracks.innerHTML = rows.join("");
  ui["no-tracks"].style.display = rows.length ? "none" : "block";
  ui.ntracks.textContent = f.tracks.length;
}

function onFrame(f) {
  lastFrameMs = Date.now();
  if (session.t0 == null) session.t0 = f.t_dev;
  if (session.live && !playing) return;  // frozen: keep receiving, stop redrawing
  frame = f;
  f.world.forEach(([x, y]) => hits.push({ x, y, t: f.t_dev }));
  hits = hits.filter(d => f.t_dev - d.t < FADE_S && d.t <= f.t_dev);
  updateHistory(f);
  ui.seek.value = f.i;
  ui.time.textContent = fmtTime(f.t_dev - session.t0);
  ui.frameno.textContent = f.i;
  ui.heading.textContent = f.yaw == null ? "—" :
    `${String(Math.round(((90 - f.yaw * 180 / Math.PI) % 360 + 360) % 360)).padStart(3, "0")}°`;
  setChip(ui["chip-radar"], f.targets.length ? "ok" : "", `${f.targets.length} detection(s) this frame`);
  const pr = f.presence;
  setChip(ui["chip-presence"], pr ? "ok" : "warn", pr ? `state: ${pr.state}` : "no LD2410 data");
  setChip(ui["chip-imu"], f.yaw == null ? "bad" : "ok", f.yaw == null ? "no heading: IMU missing" : "heading OK");
  updatePanel(f);
  draw();
}

function stream(start) {
  if (es) es.close();
  es = new EventSource(`/events?speed=${ui.speed.value}&start=${start}`);
  es.onmessage = e => { onFrame(JSON.parse(e.data)); if (!playing) es.close(); };
  es.addEventListener("end", () => { es.close(); setPlaying(false); });
}

function setPlaying(p) {
  playing = p;
  ui.play.textContent = session && session.live ? (p ? "Freeze" : "Resume") : (p ? "Pause" : "Play");
}

function startLive() {
  ui.mode.textContent = "LIVE"; ui.mode.classList.add("live");
  ui.src.textContent = session.header.src;
  [ui.speed, ui.seek, ui.frameno.parentElement].forEach(el => { el.style.display = "none"; });
  ui["rec-wrap"].hidden = false; ui.rec.textContent = session.log;
  setPlaying(true);
  es = new EventSource("/events");
  es.onmessage = e => onFrame(JSON.parse(e.data));
  setInterval(() => {
    const quiet = Date.now() - lastFrameMs;
    if (lastFrameMs && quiet > STALE_MS) setChip(ui["chip-radar"], "bad", `no data for ${(quiet / 1000).toFixed(0)} s`);
  }, 500);
}

ui.play.onclick = () => {
  if (session.live) { setPlaying(!playing); return; }
  if (playing) { es && es.close(); setPlaying(false); return; }
  setPlaying(true);
  const next = frame ? frame.i + 1 : 0;
  stream(next >= session.n ? 0 : next);
};
ui.speed.onchange = () => { if (playing && frame) stream(frame.i + 1); };
ui.seek.oninput = () => { hits = []; history = new Map(); stream(Number(ui.seek.value)); };
ui.truth.onchange = draw;
window.addEventListener("resize", resize);

Promise.all([fetch("/map").then(r => r.json()), fetch("/session").then(r => r.json())]).then(([m, s]) => {
  plan = m; session = s;
  const sim = s.header.src === "sim";
  ui.src.textContent = sim ? "Simulation" : s.header.src;
  ui.truth.parentElement.style.display = sim ? "flex" : "none";
  ui["legend-truth"].style.display = sim ? "flex" : "none";
  resize();
  if (s.live) { startLive(); return; }
  ui.seek.max = s.n - 1; stream(0);
});
</script>
</body>
</html>
