<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallhack Tactical View</title>
<style>
  :root {
    --bg: #04070a; --panel: rgba(6, 14, 12, 0.82); --edge: rgba(61, 255, 138, 0.28);
    --green: #3dff8a; --green-dim: rgba(61, 255, 138, 0.45); --green-faint: rgba(61, 255, 138, 0.10);
    --grid-minor: rgba(61, 255, 138, 0.045); --grid-major: rgba(61, 255, 138, 0.10);
    --amber: #ffb000; --cyan: #3ee6ff; --red: #ff3b3b; --muted: #6f8f80; --truth: rgba(200, 210, 205, 0.45);
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--green); font: 12px/1.4 var(--mono);
    letter-spacing: 0.04em; text-transform: uppercase; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  main { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Scanlines and vignette sit above the map but never take clicks. */
  main::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
  .frame-corner { position: absolute; width: 22px; height: 22px; border: 0 solid var(--green-dim); pointer-events: none; }
  .tl { top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; }
  .tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; }
  .br { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; }
  .hud { position: absolute; z-index: 1; padding: 10px 12px; background: var(--panel); border: 1px solid var(--edge);
    min-width: 200px; backdrop-filter: blur(2px); }
  .hud.left { top: 18px; left: 18px; }
  .hud.right { top: 18px; right: 18px; text-align: right; }
  .hud h1 { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: var(--green);
    text-shadow: 0 0 8px rgba(61, 255, 138, 0.6); }
  .hud .row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
  .hud .row b { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }
  .warn { color: var(--amber) !important; }
  .alert { color: var(--red) !important; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--edge); color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; vertical-align: middle; }
  .blink { animation: blink 1.2s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 16px;
    background: #050b09; border-top: 1px solid var(--edge); }
  button, select { font: inherit; text-transform: uppercase; letter-spacing: 0.08em; color: var(--green);
    background: transparent; border: 1px solid var(--green-dim); padding: 5px 12px; cursor: pointer; }
  button:hover, select:hover { background: var(--green-faint); }
  select option { background: #050b09; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--green); }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--green); }
  .stat { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--green); font-weight: 600; }
  @media (max-width: 640px) {
    .hud { min-width: 0; padding: 6px 8px; font-size: 10px; }
    .hud.right { top: auto; bottom: 18px; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<main>
  <canvas id="map"></canvas>
  <div class="frame-corner tl"></div><div class="frame-corner tr"></div>
  <div class="frame-corner bl"></div><div class="frame-corner br"></div>
  <section class="hud left">
    <h1>WALLHACK // TAC VIEW</h1>
    <div class="row">Mode <b id="mode">REPLAY</b></div>
    <div class="row">Source <b id="src">—</b></div>
    <div class="row">Mission time <b id="time">T+00:00.0</b></div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>Walking</span>
      <span><i style="background:var(--amber)"></i>Turning</span>
      <span><i style="background:var(--cyan)"></i>Still</span>
      <span><i style="background:var(--red)"></i>Radar hit</span>
    </div>
  </section>
  <section class="hud right">
    <div class="row">Radar hits <b id="count">0</b></div>
    <div class="row">Tracks <b id="ntracks">0</b></div>
    <div class="row">LD2410 <b id="presence">—</b></div>
    <div class="row">Heading <b id="imu">—</b></div>
  </section>
</main>
<div class="bar">
  <button id="play">❚❚ Hold</button>
  <select id="speed" aria-label="Playback speed">
    <option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
  </select>
  <input id="seek" type="range" min="0" value="0" aria-label="Timeline">
  <span class="stat" id="frameno">FRM <b>0</b></span>
  <label><input id="truth" type="checkbox" checked> Ground truth</label>
</div>
<script>
const FADE_S = 1.0;                 // radar hits fade out over this long
const RANGE_M = 6, HALF_FOV = Math.PI / 3, RINGS_M = [2, 4, 6], BEARING_TICK = Math.PI / 12;
const MARGIN_M = 1.0, BODY_R_M = 0.25, GATE_M = 0.75;
const SWEEP_PERIOD_S = 3.0;         // decorative: the LD2450 does not physically sweep
const MODE = { walking: ["--green", "WALK"], manoeuvring: ["--amber", "TURN"], still: ["--cyan", "STILL"] };

const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const ui = Object.fromEntries(["play", "speed", "seek", "time", "count", "ntracks", "presence", "imu", "truth",
  "mode", "src", "frameno"].map(id => [id, document.getElementById(id)]));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const FONT = `11px ${css("--mono")}`, FONT_BOLD = `600 11px ${css("--mono")}`;

let plan, session, frame = null, trail = [], es = null, playing = true, colors = {};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function view() {
  const b = plan.bounds, w = canvas.clientWidth, h = canvas.clientHeight;
  const bw = b.xmax - b.xmin + 2 * MARGIN_M, bh = b.ymax - b.ymin + 2 * MARGIN_M;
  const s = Math.min(w / bw, h / bh);
  const ox = (w - bw * s) / 2 - (b.xmin - MARGIN_M) * s, oy = (h + bh * s) / 2 + (b.ymin - MARGIN_M) * s;
  return { s, px: (x, y) => [ox + x * s, oy - y * s], ox, oy };
}

function poly(v, pts) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => { const [a, b] = v.px(x, y); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
  ctx.closePath();
}

function line(v, a, b) { ctx.beginPath(); ctx.moveTo(...v.px(...a)); ctx.lineTo(...v.px(...b)); ctx.stroke(); }

function draw(now) {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  if (!plan) return;
  const v = view();
  drawGrid(v);

  ctx.fillStyle = "rgba(61, 255, 138, 0.025)";
  (plan.rooms || []).forEach(r => { poly(v, r.polygon); ctx.fill(); });
  (plan.obstacles || []).forEach(o => drawHatched(v, o.polygon));

  if (frame) drawSensor(v, now);

  ctx.save();
  ctx.strokeStyle = colors.green; ctx.shadowColor = colors.green; ctx.shadowBlur = 8; ctx.lineCap = "square";
  plan.walls.forEach(w => { ctx.lineWidth = ["brick", "concrete"].includes(w.material) ? 3 : 1.6; line(v, w.a, w.b); });
  ctx.restore();

  if (!frame) return;
  if (ui.truth.checked && frame.truth) drawTruth(v);
  drawHits(v);
  drawTracks(v);
  drawOperator(v);
}

function drawGrid(v) {
  const b = plan.bounds, x0 = Math.floor(b.xmin - MARGIN_M), x1 = Math.ceil(b.xmax + MARGIN_M);
  const y0 = Math.floor(b.ymin - MARGIN_M), y1 = Math.ceil(b.ymax + MARGIN_M);
  ctx.lineWidth = 1;
  for (let g = x0; g <= x1; g += 0.5) {
    ctx.strokeStyle = Number.isInteger(g) ? colors.gridMajor : colors.gridMinor; line(v, [g, y0], [g, y1]);
  }
  for (let g = y0; g <= y1; g += 0.5) {
    ctx.strokeStyle = Number.isInteger(g) ? colors.gridMajor : colors.gridMinor; line(v, [x0, g], [x1, g]);
  }
  ctx.fillStyle = colors.muted; ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let g = Math.ceil(b.xmin); g <= b.xmax; g++) { const [x, y] = v.px(g, y0); ctx.fillText(`${g}M`, x, y - 16); }
}

function drawHatched(v, pts) {
  ctx.save(); poly(v, pts); ctx.clip();
  const xs = pts.map(p => v.px(...p)[0]), ys = pts.map(p => v.px(...p)[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  ctx.strokeStyle = colors.greenFaint; ctx.lineWidth = 1;
  for (let k = x0 - (y1 - y0); k < x1; k += 7) { ctx.beginPath(); ctx.moveTo(k, y1); ctx.lineTo(k + (y1 - y0), y0); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = colors.greenDim; ctx.setLineDash([3, 3]); poly(v, pts); ctx.stroke(); ctx.setLineDash([]);
}

function sector(hx, hy, r) { ctx.arc(hx, hy, r, -(frame.yaw ?? 0) - HALF_FOV, -(frame.yaw ?? 0) + HALF_FOV); }

function drawSensor(v, now) {
  const pose = frame.pose || { x: 0, y: 0 }, yaw = frame.yaw ?? 0, [hx, hy] = v.px(pose.x, pose.y);
  const R = RANGE_M * v.s;

  const grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, R);
  grad.addColorStop(0, "rgba(61, 255, 138, 0.10)"); grad.addColorStop(1, "rgba(61, 255, 138, 0.02)");
  ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(hx, hy); sector(hx, hy, R); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = colors.greenDim; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hx, hy); sector(hx, hy, R); ctx.closePath(); ctx.stroke();
  ctx.setLineDash([2, 6]);
  RINGS_M.slice(0, -1).forEach(r => { ctx.beginPath(); sector(hx, hy, r * v.s); ctx.stroke(); });
  ctx.setLineDash([]);

  ctx.fillStyle = colors.green; ctx.font = FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  RINGS_M.forEach(r => {
    const a = yaw - HALF_FOV;
    ctx.fillText(`${r}M`, hx + r * v.s * Math.cos(a) + 4, hy - r * v.s * Math.sin(a) + 8);
  });
  ctx.textAlign = "center";
  for (let a = -HALF_FOV; a <= HALF_FOV + 1e-9; a += BEARING_TICK) {
    const ang = yaw + a, c = Math.cos(ang), s = Math.sin(ang), major = Math.abs(a % (Math.PI / 6)) < 1e-6;
    ctx.beginPath(); ctx.moveTo(hx + R * c, hy - R * s); ctx.lineTo(hx + (R + (major ? 8 : 4)) * c, hy - (R + (major ? 8 : 4)) * s);
    ctx.stroke();
    if (major) ctx.fillText(`${Math.round(-a * 180 / Math.PI)}°`, hx + (R + 18) * c, hy - (R + 18) * s);
  }

  const phase = (now / 1000 / SWEEP_PERIOD_S) % 2, u = phase < 1 ? phase : 2 - phase;
  const sweep = yaw - HALF_FOV + 2 * HALF_FOV * u, dir = phase < 1 ? -1 : 1;
  for (let k = 0; k < 12; k++) {
    const a = sweep + dir * k * 0.02;
    if (a < yaw - HALF_FOV || a > yaw + HALF_FOV) continue;
    ctx.strokeStyle = `rgba(61, 255, 138, ${0.35 * (1 - k / 12)})`;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + R * Math.cos(a), hy - R * Math.sin(a)); ctx.stroke();
  }

  const pr = frame.presence;
  if (pr) [["moving_m", colors.red], ["still_m", colors.amber]].forEach(([key, color]) => {
    if (pr[key] == null) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = 0.8;
    [-GATE_M / 2, GATE_M / 2].forEach(d => { ctx.beginPath(); sector(hx, hy, (pr[key] + d) * v.s); ctx.stroke(); });
    ctx.globalAlpha = 0.08; ctx.lineWidth = GATE_M * v.s; ctx.beginPath(); sector(hx, hy, pr[key] * v.s); ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawOperator(v) {
  const pose = frame.pose || { x: 0, y: 0 }, yaw = frame.yaw ?? 0, [hx, hy] = v.px(pose.x, pose.y);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(-yaw);
  ctx.strokeStyle = colors.green; ctx.fillStyle = colors.bg; ctx.lineWidth = 1.5;
  ctx.shadowColor = colors.green; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, 7); ctx.lineTo(-3, 0); ctx.lineTo(-7, -7); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle = colors.green; ctx.font = FONT_BOLD; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillText("OP", hx, hy + 12);
}

function drawTruth(v) {
  ctx.strokeStyle = colors.truth; ctx.fillStyle = colors.truth; ctx.lineWidth = 1; ctx.setLineDash([1, 3]);
  ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  frame.truth.people.forEach(p => {
    const [x, y] = v.px(p.x, p.y);
    ctx.beginPath(); ctx.arc(x, y, BODY_R_M * v.s, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillText(`GT${p.id}`, x, y - BODY_R_M * v.s - 3);
  });
  ctx.setLineDash([]);
}

function drawHits(v) {
  trail.forEach(d => {
    const age = frame.t_dev - d.t, [x, y] = v.px(d.x, d.y), a = Math.max(0, 1 - age / FADE_S), r = age === 0 ? 5 : 3;
    ctx.strokeStyle = `rgba(255, 59, 59, ${a})`; ctx.lineWidth = age === 0 ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
  });
}

function drawTracks(v) {
  const pose = frame.pose || { x: 0, y: 0 };
  (frame.tracks || []).forEach(t => {
    const [colorVar, tag] = MODE[t.mode] || ["--green", "TRK"], color = css(colorVar);
    const [x, y] = v.px(t.x, t.y), h = BODY_R_M * v.s + 4, k = Math.max(5, h * 0.45);
    ctx.strokeStyle = color; ctx.fillStyle = color;

    ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(x, y); t.path.forEach(p => ctx.lineTo(...v.px(...p))); ctx.stroke();
    ctx.setLineDash([]);
    t.path.forEach(p => { const [px, py] = v.px(...p); ctx.fillRect(px - 1.5, py - 1.5, 3, 3); });

    ctx.save(); ctx.lineWidth = 1.6; ctx.shadowColor = color; ctx.shadowBlur = t.coasting ? 0 : 8;
    if (t.coasting) ctx.setLineDash([3, 3]);
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(x + sx * h, y + sy * (h - k)); ctx.lineTo(x + sx * h, y + sy * h);
      ctx.lineTo(x + sx * (h - k), y + sy * h); ctx.stroke();
    });
    ctx.restore();
    ctx.fillRect(x - 1.5, y - 1.5, 3, 3);

    const one = t.path[1] || [t.x, t.y], speed = Math.hypot(one[0] - t.x, one[1] - t.y);
    const range = Math.hypot(t.x - pose.x, t.y - pose.y);
    // Put the label on the side the target is not heading to, and keep it on screen.
    const [ex] = v.px(...one), LABEL_W = 130;
    const left = (ex - x > 2 || x + h + LABEL_W > canvas.clientWidth) && x - h - LABEL_W > 0;
    const lx = left ? x - h - 6 : x + h + 6;
    ctx.font = FONT_BOLD; ctx.textAlign = left ? "right" : "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(`TGT-${String(t.id).padStart(2, "0")} ${t.coasting ? "LOST" : tag}`, lx, y - 2);
    ctx.font = FONT; ctx.globalAlpha = 0.75;
    ctx.fillText(`${range.toFixed(1)}M  ${speed.toFixed(1)}M/S`, lx, y + 11);
    ctx.globalAlpha = 1;
  });
}

function onFrame(f) {
  frame = f;
  f.world.forEach(([x, y]) => trail.push({ x, y, t: f.t_dev }));
  trail = trail.filter(d => f.t_dev - d.t < FADE_S && d.t <= f.t_dev);
  ui.seek.value = f.i;
  const t = f.t_dev - session.t0, m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, "0");
  ui.time.textContent = `T+${String(m).padStart(2, "0")}:${s}`;
  ui.frameno.innerHTML = `FRM <b>${String(f.i).padStart(5, "0")}</b>`;
  ui.count.textContent = f.targets.length;
  ui.ntracks.textContent = f.tracks.length;
  const pr = f.presence;
  ui.presence.textContent = !pr ? "OFFLINE" : pr.state === "none" ? "CLEAR" :
    [pr.moving_m != null && `MOV ${pr.moving_m.toFixed(1)}M`, pr.still_m != null && `STILL ${pr.still_m.toFixed(1)}M`]
      .filter(Boolean).join(" · ");
  ui.presence.className = !pr ? "warn" : "";
  ui.imu.textContent = f.yaw == null ? "NO IMU" : `${String(Math.round(((90 - f.yaw * 180 / Math.PI) % 360 + 360) % 360)).padStart(3, "0")}°`;
  ui.imu.className = f.yaw == null ? "alert blink" : "";
}

function stream(start) {
  if (es) es.close();
  es = new EventSource(`/events?speed=${ui.speed.value}&start=${start}`);
  es.onmessage = e => { onFrame(JSON.parse(e.data)); if (!playing) es.close(); };
  es.addEventListener("end", () => { es.close(); setPlaying(false); });
}

function setPlaying(p) { playing = p; ui.play.textContent = p ? "❚❚ Hold" : "▶ Run"; }

ui.play.onclick = () => {
  if (playing) { es && es.close(); setPlaying(false); return; }
  setPlaying(true);
  const next = frame ? frame.i + 1 : 0;
  stream(next >= session.n ? 0 : next);
};
ui.speed.onchange = () => { if (playing && frame) stream(frame.i + 1); };
ui.seek.oninput = () => { trail = []; stream(Number(ui.seek.value)); };
window.addEventListener("resize", resize);

function loop(now) { draw(now); requestAnimationFrame(loop); }

colors = {
  green: css("--green"), greenDim: css("--green-dim"), greenFaint: css("--green-faint"), amber: css("--amber"),
  red: css("--red"), muted: css("--muted"), truth: css("--truth"), bg: css("--bg"),
  gridMinor: css("--grid-minor"), gridMajor: css("--grid-major"),
};
resize();
Promise.all([fetch("/map").then(r => r.json()), fetch("/session").then(r => r.json())]).then(([m, s]) => {
  plan = m; session = s; ui.seek.max = s.n - 1;
  ui.src.textContent = s.header.src === "sim" ? "SIMULATION" : s.header.src.toUpperCase();
  ui.truth.parentElement.style.display = s.header.src === "sim" ? "flex" : "none";
  stream(0); requestAnimationFrame(loop);
});
</script>
</body>
</html>
